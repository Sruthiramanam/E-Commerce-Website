<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav>
        <h1>ShopEasy</h1>

        <input
            type="text"
            id="search"
            placeholder="Search products..."
        >

        <button id="cart-btn">
            Cart (<span id="cart-count">0</span>)
        </button>
    </nav>

    <!-- Products -->
    <main>
        <h2>Our Products</h2>

        <div class="products" id="product-list">

            <div class="product">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80">

                <h3>Smart Watch</h3>
                <p>₹2,999</p>

                <button onclick="addToCart('Smart Watch', 2999)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80">

                <h3>Running Shoes</h3>
                <p>₹1,999</p>

                <button onclick="addToCart('Running Shoes', 1999)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80">

                <h3>Headphones</h3>
                <p>₹1,499</p>

                <button onclick="addToCart('Headphones', 1499)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=500&q=80">

                <h3>Camera</h3>
                <p>₹25,999</p>

                <button onclick="addToCart('Camera', 25999)">
                    Add to Cart
                </button>
            </div>

        </div>
    </main>

    <!-- Cart -->
    <div class="cart" id="cart">

        <div class="cart-header">
            <h2>Shopping Cart</h2>

            <button id="close-cart">✖</button>
        </div>

        <div id="cart-items"></div>

        <h3>
            Total: ₹<span id="total">0</span>
        </h3>

        <button class="checkout">
            Checkout
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
